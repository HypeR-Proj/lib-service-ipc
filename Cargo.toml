[package]
name = "hyper-service-ipc"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/service-ipc"

[dependencies.hyper-os]
version = "=0.0.0"

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.serde_json]
version = "1"

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(target_os, values(\"hyper\"))",
]

[workspace]
members = [
    ".",
]
resolver = "3"
